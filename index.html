<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>عجلة الاختيار العشوائي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fff; --muted:#c3b4ee; --pink:#ff4f8b; --sun:#ffc93c; --cyan:#19d3da; --violet:#7a52ff; --orange:#ff8a3d;
  --glass:rgba(24,44,78,.72); --line:rgba(255,255,255,.16);
  --font:'Tajawal','Cairo','Segoe UI',Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:var(--font);color:var(--ink);
  background:#2f8a4f;
}
button,textarea{font-family:inherit}
.bgart{position:fixed;inset:0;z-index:0;overflow:hidden}
.bgart svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ray{animation:ray 7s ease-in-out infinite}.r1{animation-delay:-2.5s}.r2{animation-delay:-5s}
@keyframes ray{0%,100%{opacity:.35}50%{opacity:1}}
.ff{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff7b0;box-shadow:0 0 10px 4px rgba(255,240,140,.75);animation:ff linear infinite}
@keyframes ff{0%{transform:translate(0,0);opacity:0}15%{opacity:1}50%{transform:translate(40px,-60px);opacity:.5}85%{opacity:1}100%{transform:translate(-30px,-120px);opacity:0}}
.app{z-index:1}
.tw{animation:tw 3s ease-in-out infinite}
.ff{background:#fff7b0;box-shadow:0 0 10px 4px rgba(255,240,140,.75)}
.tw{animation:tw 3s ease-in-out infinite}
.ff{background:#fff7b0;box-shadow:0 0 10px 4px rgba(255,240,140,.75)}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh;position:relative}

/* ===== الرأس ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:12px;min-width:0;background:rgba(24,44,78,.78);border:1px solid rgba(255,255,255,.2);padding:5px 16px 5px 8px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.logo{flex:none;width:38px;height:38px;border-radius:50%;position:relative;
  background:conic-gradient(#ff4f8b 0 60deg,#ffc93c 60deg 120deg,#19d3da 120deg 180deg,#7a52ff 180deg 240deg,#a8e063 240deg 300deg,#ff8a3d 300deg);
  border:3px solid rgba(255,255,255,.5);animation:spin 9s linear infinite}
.logo::after{content:'';position:absolute;inset:34%;border-radius:50%;background:#2a0f66;border:2px solid #fff}
h1{margin:0;font-size:clamp(18px,3.2vw,28px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(90deg,#ffe27a,#ff7eb0);-webkit-background-clip:text;background-clip:text;color:transparent}
.tools{display:flex;gap:8px;align-items:center}
.icon-btn{height:42px;min-width:42px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;cursor:pointer;transition:transform .15s,background .2s}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#optBtn{display:inline-flex}
#optBtn .cnt{background:var(--pink);border-radius:10px;padding:0 8px;font-size:13px;line-height:20px}

/* ===== المحتوى ===== */
main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:0 16px 6px;min-height:0;position:relative}
.decor{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.stars{position:absolute;left:0;right:0;top:0;height:55%;animation:tw 4s ease-in-out infinite;
  background:radial-gradient(1.6px 1.6px at 8% 18%,#fff,transparent),radial-gradient(1.2px 1.2px at 17% 52%,#fff,transparent),radial-gradient(1.8px 1.8px at 29% 12%,#ffe9a8,transparent),
  radial-gradient(1.2px 1.2px at 41% 40%,#fff,transparent),radial-gradient(1.6px 1.6px at 52% 8%,#fff,transparent),radial-gradient(1.2px 1.2px at 63% 33%,#fff,transparent),
  radial-gradient(1.8px 1.8px at 74% 15%,#ffe9a8,transparent),radial-gradient(1.2px 1.2px at 83% 46%,#fff,transparent),radial-gradient(1.6px 1.6px at 92% 24%,#fff,transparent),radial-gradient(1.2px 1.2px at 58% 58%,#fff,transparent)}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.bob{animation:bob 4.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.8deg)}50%{transform:translateY(4px) rotate(.8deg)}}
.drift{animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(90px)}}
.land{position:absolute;left:0;right:0;bottom:0;width:100%;height:52%;display:block}
.cloud{position:absolute;left:0;opacity:.92;animation:cloud linear infinite;will-change:transform}
.cloud svg{display:block;width:100%;height:auto}
@keyframes cloud{from{transform:translateX(-260px)}to{transform:translateX(calc(100vw + 260px))}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.stage{display:flex;flex-direction:column;align-items:center;min-height:0;min-width:0;position:relative;z-index:1}
.area{flex:1 1 0;min-height:0;width:100%;position:relative}
.wrap{position:absolute;left:50%;top:50%;width:var(--s,300px);height:var(--s,300px);transform:translate(-50%,-50%)}
.wrap::after{content:'';position:absolute;left:14%;right:14%;bottom:-2%;height:6%;z-index:0;background:radial-gradient(ellipse at center,rgba(15,35,60,.4),transparent 70%)}
.wrap::before{content:'';position:absolute;inset:2%;border-radius:50%;filter:blur(26px);opacity:.45;transition:opacity .6s;background:radial-gradient(circle,rgba(255,236,205,.9),rgba(255,214,235,.5) 60%,transparent 72%)}
body.is-spinning .wrap::before{opacity:.8}
#wheel{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.pointer{position:absolute;z-index:3;transform-origin:50% 35%;filter:drop-shadow(0 5px 7px rgba(0,0,0,.55));pointer-events:none}
.hub{position:absolute;z-index:2;left:50%;top:50%;width:calc(var(--s)*.2);height:calc(var(--s)*.2);margin:calc(var(--s)*-.1) 0 0 calc(var(--s)*-.1);
  border:0;border-radius:50%;color:#fff;font-weight:900;font-size:calc(var(--s)*.05);cursor:pointer;
  background:radial-gradient(circle at 35% 28%,#f9b3c5,#e8788f 48%,#b04468);
  box-shadow:0 0 0 calc(var(--s)*.008) #fff,0 10px 24px rgba(0,0,0,.5),inset 0 -8px 14px rgba(0,0,0,.22);
  transition:transform .15s,filter .3s}
.hub:hover:not(:disabled){transform:scale(1.07)}
.hub:active:not(:disabled){transform:scale(.93)}
.hub:disabled{cursor:default;filter:saturate(.5) brightness(.85)}
.hub::before{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid #f6a8bd;animation:pulse 1.8s ease-out infinite;pointer-events:none}
body.is-spinning .hub::before,.hub:disabled::before{animation:none;opacity:0}
.live{height:46px;flex:none;display:flex;align-items:center;justify-content:center;max-width:100%;padding:0 18px;margin-top:6px;
  border-radius:999px;border:1px solid var(--line);background:var(--glass);font-weight:800;font-size:clamp(14px,2.2vw,18px);color:#fff}
.live span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(80vw,520px)}

/* ===== اللوحة ===== */
.panel{position:fixed;left:16px;top:68px;bottom:14px;width:min(390px,calc(100vw - 32px));z-index:40;transform:translateX(calc(-100% - 24px));transition:transform .38s cubic-bezier(.2,.9,.3,1);box-shadow:0 20px 60px rgba(0,0,0,.35);background:rgba(24,44,78,.88);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.panel.open{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph h2{margin:0;font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px}
.badge{background:linear-gradient(135deg,var(--pink),var(--orange));border-radius:12px;padding:1px 10px;font-size:14px;font-weight:900}
.closeD{display:inline-flex;width:38px;height:38px;min-width:38px;padding:0}
textarea{flex:1 1 160px;min-height:110px;width:100%;resize:none;border-radius:16px;border:1px solid var(--line);background:rgba(10,4,30,.45);
  color:#fff;font-size:16px;line-height:1.75;padding:10px 12px;outline:none;direction:rtl}
textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(25,211,218,.25)}
textarea:read-only{opacity:.6}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 2px 0}
.sec{font-size:13px;font-weight:800;color:var(--muted);margin:2px 2px 0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:700;cursor:pointer;transition:transform .15s,background .2s}
.chip:hover{background:rgba(255,255,255,.2)}
.chip:active{transform:scale(.94)}
.chip.main{background:linear-gradient(135deg,#7a52ff,#c44be0);border-color:transparent}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.btn{border:0;border-radius:14px;padding:11px 16px;min-height:44px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.95)}
.btn.primary{background:linear-gradient(135deg,var(--pink),var(--orange))}
.btn.ghost{background:rgba(255,255,255,.12);border:1px solid var(--line)}
.btn.cyan{background:linear-gradient(135deg,#19c6d1,#3d8bff)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 4px;font-size:14px;font-weight:700;cursor:pointer}
.sw input{display:none}
.sw .k{flex:none;width:46px;height:26px;border-radius:999px;background:rgba(255,255,255,.2);position:relative;transition:background .25s}
.sw .k::after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s}
.sw input:checked+.k{background:var(--cyan)}
.sw input:checked+.k::after{transform:translateX(-20px)}
.hist{max-height:150px;min-height:40px;overflow:auto;display:flex;flex-direction:column;gap:5px;flex:none}
.hist .it{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px}
.hist .n{flex:none;min-width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:900;color:#2b0f54}
.hist .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .empty{color:var(--muted);font-size:13px;padding:6px 4px}
.hh{display:flex;align-items:center;justify-content:space-between}
.mini{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:underline;padding:4px}

/* ===== التذييل ===== */
.credit{justify-self:center;font-size:12px;color:#e6dcff;padding:3px 16px;margin:0 8px 8px;border-radius:999px;background:rgba(24,44,78,.78);position:relative;z-index:2;font-weight:500;max-width:calc(100% - 16px);text-align:center}

/* ===== النافذة ===== */
.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(12,5,32,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:50;opacity:0;pointer-events:none;transition:opacity .3s;overflow:hidden}
.modal.show{opacity:1;pointer-events:auto}
.modal::before{content:'';position:absolute;width:150vmax;height:150vmax;left:50%;top:50%;margin:-75vmax 0 0 -75vmax;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,201,60,.16) 0 8deg,transparent 8deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 50%);mask:radial-gradient(circle,#000 0,transparent 50%);animation:spin 40s linear infinite}
.card{position:relative;z-index:1;width:min(560px,92vw);max-height:92dvh;overflow:auto;border-radius:30px;padding:26px 20px 20px;text-align:center;
  background:linear-gradient(160deg,#42208f,#22104f);border:2px solid rgba(255,255,255,.22);
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 7px color-mix(in srgb,var(--wc,#ff4f8b) 35%,transparent);
  transform:scale(.7) translateY(30px);transition:transform .55s cubic-bezier(.2,1.4,.4,1)}
.modal.show .card{transform:none}
.card .lbl{color:var(--muted);font-weight:800;font-size:clamp(15px,3vw,19px)}
.card .name{display:inline-block;max-width:100%;margin:12px 0 20px;padding:.12em .6em;border-radius:22px;line-height:1.4;word-break:break-word;
  font-size:clamp(28px,7vw,60px);font-weight:900;background:var(--wc,#ff4f8b);color:var(--wt,#2b0f54);animation:pop 1.2s ease-in-out infinite}
.card .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.card .acts .btn{flex:1 1 140px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.8;transform:scale(1)}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(25deg)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* ===== التكيّف ===== */
@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr)}
  #optBtn{display:inline-flex}
  .closeD{display:inline-flex}
  .panel{position:fixed;left:0;right:0;top:auto;bottom:0;width:auto;height:min(80dvh,680px);border-radius:26px 26px 0 0;z-index:40;
    background:#182c4e;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.3,1);padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .panel.open{transform:none}
  .dbg{position:fixed;inset:0;background:rgba(10,4,30,.55);z-index:39;opacity:0;pointer-events:none;transition:opacity .3s}
  .dbg.show{opacity:1;pointer-events:auto}
}
@media (min-width:901px){.dbg{display:none}}
@media (max-width:520px){
  #optBtn .lbl,#fsBtn{display:none}
  .top{padding:10px 12px}.tools{gap:6px}.icon-btn{height:40px;min-width:40px;padding:0 10px}
  .brand{gap:8px;padding:4px 12px 4px 6px}.logo{width:30px;height:30px}h1{font-size:16px}
}
@media (max-height:520px){
  .top{padding:6px 12px}.logo{width:30px;height:30px}.icon-btn{height:36px}
  .live{height:34px;margin-top:2px}.credit{padding:2px 12px;margin-bottom:4px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.logo,.wrap::before,.ray,.ff,.stars,.bob,.drift,.sway,.card .name,.modal::before{animation:none}}

/* ===== الخلفية المصوّرة والطالبة ===== */
.ringw{pointer-events:auto;cursor:pointer}
.beam{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;opacity:0;transition:opacity .3s}
.beam.on{opacity:1}
.beam .b1{fill:none;stroke:rgba(255,236,180,.55);stroke-width:14;stroke-linecap:round;filter:blur(6px)}
.beam .b2{fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:2 16;animation:flow .45s linear infinite;filter:drop-shadow(0 0 5px #ffe7a8)}
.beam .imp{fill:none;stroke:#fff;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:imp .6s ease-out infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes imp{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.8);opacity:0}}
.bgart{background:#4aa3dc}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.bgart::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,30,60,0),rgba(10,30,60,.12));pointer-events:none}
.stage{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;column-gap:8px;align-items:stretch}
.area{grid-column:2;grid-row:1}
.live{grid-column:2;grid-row:2;justify-self:center;align-self:center}
.mascot{grid-column:1;grid-row:1 / span 2;align-self:end;height:min(calc(100dvh - 128px),780px);aspect-ratio:522/830;position:relative;pointer-events:none}
.mi{position:absolute;inset:0;transform-origin:50% 100%;animation:msway 5.5s ease-in-out infinite}
.mimg{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 12px 14px rgba(0,0,0,.35))}
@keyframes msway{0%,100%{transform:rotate(-.9deg) translateY(0)}50%{transform:rotate(.9deg) translateY(-5px)}}
body.is-spinning .mi{animation:mpoke .75s ease-in-out infinite}
@keyframes mpoke{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(-10px) rotate(-2.6deg)}}
.mi.cheer{animation:mcheer 1.5s ease-in-out 1}
@keyframes mcheer{0%{transform:translateY(0)}22%{transform:translateY(-16px) rotate(1.2deg)}44%{transform:translateY(0)}64%{transform:translateY(-8px) rotate(-1deg)}84%,100%{transform:translateY(0)}}
.ringw{position:absolute;left:15.9%;top:26.7%;width:33%;aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 0 6px rgba(150,240,255,.9))}
.ring{width:100%;height:100%;display:block}
.ring g{transform-box:fill-box;transform-origin:50% 50%}
.r1{animation:rot 10s linear infinite}.r2{animation:rot 7s linear infinite reverse}
body.is-spinning .r1{animation-duration:.9s}body.is-spinning .r2{animation-duration:.7s}
@keyframes rot{to{transform:rotate(360deg)}}
.rip{position:absolute;left:11.5%;top:23.5%;width:15%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.9);transform:translate(-50%,-50%) scale(.2);opacity:0;animation:rip 3.8s ease-out infinite}
.rip:nth-child(n+2){display:none}
body.is-spinning .rip{display:block;animation-duration:1.2s}
body.is-spinning .rip:nth-child(2){animation-delay:.4s}body.is-spinning .rip:nth-child(3){animation-delay:.8s}
@keyframes rip{0%{transform:translate(-50%,-50%) scale(.2);opacity:.95}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
@media (max-width:900px){
  .area{grid-column:1 / -1}
  .live{grid-row:2;grid-column:2;margin-top:0}
  .mascot{grid-column:1;grid-row:2;height:clamp(130px,19dvh,210px)}
}
@media (prefers-reduced-motion:reduce){.bgimg,.mi,.r1,.r2,.rip{animation:none}}
</style>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const PALETTE = ['#e8788f','#6db6d8','#f4a95f','#a98bdc','#ee8f78','#c985d6'];
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

const STUDENTS = ['أرياف الهطالية','أريج الخاطرية','آلاء الخاطرية','إيمان الخاطرية','أزهار الهطالية','الزهراء الخاطرية','بدور الخاطرية','بلقيس الخاطرية','بلقيس الخاطرية','رناد الخاطرية','رنيم الخاطرية','ريتال الخاطرية','زينب الخاطرية','سارة الخاطرية','ساره الخاطرية','سجى الخاطرية','شروق الهطالية','طيف الخاطرية','عائشة الهطالية','فداء الهطالية','ملاك الخاطرية','مها الخاطرية','مهاد الهطالية','ميرة الخاطرية','نجاة الخاطرية','نور الخاطرية','هناء الهطالية','وئام الخاطرية','وعد الخاطرية','يسرى الخاطرية'];
const STUDENTS2 = ['آيه الخاطرية','بيان الهطالية','جود الخاطرية','ديمه الخاطرية','رغد الخاطرية','رنا الهطالية','رهام الخاطرية','ريماز الخاطرية','شذى الخاطرية','شهد الخاطرية','شهلاء الهطالية','طيف الخاطرية','عهد الهطالية','لجين الخاطرية','ليان الخاطرية','مريم الهطالية','ملاك الهطالية','نور الخاطرية','نوف الخاطرية','هبة الخاطرية'];
const STUDENTS5 = ['إيلاف الخاطرية','بشرى الهطالية','جنات الخاطرية','جود الخاطرية','حلا الخاطرية','خلود الخاطرية','رغد الخاطرية','زهى الهطالية','ساره الهطالية','شذى الخاطرية','شروق الخاطرية','شهلاء الخاطرية','طيف الخاطرية','مرام الهطالية','مريم الخاطرية','مريم الخاطرية','مزن الهطالية','ندى الهطالية','نهاد الهطالية','نهى الخاطرية','نور الخاطرية','نور الخاطرية','ولاء الخاطرية'];
const range = n => Array.from({length:n}, (_,i) => String(i+1));
const PRESETS = [
  ['الصف السابع', STUDENTS, true],
  ['الصف الثامن', STUDENTS2, true],
  ['الصف الخامس', STUDENTS5, true],
  ['أرقام من 1 إلى 30', range(30)],
  ['الجهات الأربع', ['الشمال','الجنوب','الشرق','الغرب']],
  ['نعم / لا', ['نعم','لا']]
];

const state = { items: STUDENTS.slice(), theta: 0, spinning: false, sound: true, auto: false };
let hist = [], histN = 0, winnerIdx = -1, pending = null;
try {
  const sv = JSON.parse(localStorage.getItem('wheel_v1') || 'null');
  if (sv && Array.isArray(sv.items) && sv.items.length) { state.items = sv.items.slice(0,100); state.sound = sv.sound !== false; state.auto = !!sv.auto; }
} catch(e){}
function save(){ try{ localStorage.setItem('wheel_v1', JSON.stringify({items:state.items, sound:state.sound, auto:state.auto})); }catch(e){} }

/* ===== عناصر ===== */
const area=$('#area'), wrap=$('#wrap'), cvs=$('#wheel'), ctx=cvs.getContext('2d'), hub=$('#hub'), ptr=$('#pointer'),
  live=$('#live'), listEl=$('#list'), panel=$('#panel'), dbg=$('#dbg'), modal=$('#modal');
const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
let S=300, R, rimW, faceR, face=null, rims=[];

/* ===== ألوان ===== */
function lum(h){ const n=parseInt(h.slice(1),16); return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255; }
function shade(h,a){ const n=parseInt(h.slice(1),16); let r=n>>16&255,g=n>>8&255,b=n&255; const f=a<0?0:255,p=Math.abs(a);
  return `rgb(${Math.round((f-r)*p+r)},${Math.round((f-g)*p+g)},${Math.round((f-b)*p+b)})`; }
function colorOf(i,N){ let c=i%PALETTE.length; if(i===N-1 && c===0 && N>1) c=3; return PALETTE[c]; }
const textOn = c => lum(c) > 0.52 ? '#2b0f54' : '#ffffff';

/* ===== بناء العجلة ===== */
function geometry(){
  R = S*0.43; rimW = R*0.1; faceR = R - rimW;
  const pw = S*0.095, ph = pw*80/60;
  ptr.style.width = pw+'px'; ptr.style.height = ph+'px';
  ptr.style.left = (S/2 - pw/2)+'px';
  ptr.style.top = ((S/2 - faceR) + S*0.012 - ph)+'px';
}
function makeRim(k){
  const c=document.createElement('canvas'); c.width=c.height=Math.round(S*dpr);
  const x=c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  const cx=S/2, ol=Math.max(3,S*0.008);
  const g=x.createLinearGradient(0,cx-R,0,cx+R);
  g.addColorStop(0,'#fffaf2'); g.addColorStop(.55,'#f1e4f3'); g.addColorStop(1,'#d3bfe0');
  x.beginPath(); x.arc(cx,cx,R,0,TAU); x.arc(cx,cx,R-rimW,0,TAU,true); x.fillStyle=g; x.fill();
  x.lineWidth=ol; x.strokeStyle='#5a3a6e';
  x.beginPath(); x.arc(cx,cx,R-ol/2,0,TAU); x.stroke();
  x.beginPath(); x.arc(cx,cx,R-rimW+ol/2,0,TAU); x.stroke();
  const BC=['#fff1c2','#fff1c2','#fff1c2'], nb=24, rb=rimW*0.27, pr=R-rimW/2;
  for(let i=0;i<nb;i++){
    const a=i/nb*TAU-Math.PI/2, px=cx+Math.cos(a)*pr, py=cx+Math.sin(a)*pr, on=(i%3===k), col=BC[i%3];
    x.save();
    if(on){ x.shadowColor='#ffe7a0'; x.shadowBlur=rimW*1.0*dpr; }
    x.fillStyle=on?col:'#d9c9e3'; x.strokeStyle='rgba(90,58,110,.7)'; x.lineWidth=1.4;
    x.beginPath(); x.arc(px,py,on?rb*1.15:rb*.9,0,TAU); x.fill(); x.shadowBlur=0; x.stroke(); x.restore();
    if(on){ x.fillStyle='rgba(255,255,255,.85)'; x.beginPath(); x.arc(px-rb*.3,py-rb*.3,rb*.3,0,TAU); x.fill(); }
  }
  return c;
}
function makeFace(){
  const N=state.items.length;
  const c=document.createElement('canvas'); c.width=c.height=Math.round(faceR*2*dpr);
  const x=c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.translate(faceR,faceR);
  if(N<2){
    x.beginPath(); x.arc(0,0,faceR,0,TAU); x.fillStyle='#3b2a78'; x.fill();
    x.fillStyle='rgba(255,255,255,.85)'; x.textAlign='center'; x.textBaseline='middle'; x.direction='rtl';
    x.font=`800 ${faceR*0.1}px Tajawal,Cairo,Tahoma,sans-serif`;
    x.fillText('أضف خيارين على الأقل',0,faceR*0.45);
    return c;
  }
  const seg=TAU/N;
  for(let i=0;i<N;i++){
    const col=colorOf(i,N), a0=i*seg-Math.PI/2, a1=a0+seg;
    const g=x.createRadialGradient(0,0,faceR*0.1,0,0,faceR);
    g.addColorStop(0,shade(col,-0.10)); g.addColorStop(.6,col); g.addColorStop(1,shade(col,0.06));
    x.beginPath(); x.moveTo(0,0); x.arc(0,0,faceR,a0,a1); x.closePath(); x.fillStyle=g; x.fill();
    x.lineWidth=2.5; x.lineJoin='round'; x.strokeStyle='rgba(255,255,255,.9)'; x.stroke();
  }
  x.lineWidth=4; x.strokeStyle='#5a3a6e'; x.beginPath(); x.arc(0,0,faceR-1,0,TAU); x.stroke();
  // النصوص
  const xs=faceR*0.93, maxW=faceR*0.62;
  const fam='Tajawal,Cairo,"Segoe UI",Tahoma,sans-serif';
  for(let i=0;i<N;i++){
    const col=colorOf(i,N), mid=(i+0.5)*seg-Math.PI/2;
    let txt=state.items[i];
    const thick=2*Math.sin(seg/2)*faceR*0.62;
    let fs=Math.max(9, Math.min(faceR*0.115, thick*0.62));
    x.font=`800 ${fs}px ${fam}`;
    let w=x.measureText(txt).width;
    if(w>maxW){ fs=fs*maxW/w*0.96; if(fs<9) fs=9; x.font=`800 ${fs}px ${fam}`; w=x.measureText(txt).width;
      while(w>maxW && txt.length>2){ txt=txt.slice(0,-1); w=x.measureText(txt+'…').width; if(w<=maxW) txt+='…'; } }
    // لا يتجاوز ارتفاع الخط عرض الشريحة عند الطرف الداخلي للنص (منعًا للتداخل)
    let guard=0;
    while(fs>8 && fs>0.82*2*(xs-w)*Math.sin(seg/2) && guard++<40){ fs*=0.94; x.font=`800 ${fs}px ${fam}`; w=x.measureText(txt).width; }
    const flip=Math.cos(mid)<-0.0001;  // النصف الأيسر: نقلب النص ليبقى مقروءًا
    x.save(); x.rotate(flip?mid+Math.PI:mid); x.textAlign=flip?'left':'right'; x.textBaseline='middle'; x.direction='rtl';
    x.fillStyle='#3b1d52'; x.fillText(txt,flip?-xs:xs,0); x.restore();
  }
  // مسامير
  for(let i=0;i<N;i++){
    const a=i*seg-Math.PI/2, r=faceR*0.962;
    x.save(); x.fillStyle='#fff'; x.strokeStyle='rgba(90,58,110,.6)'; x.lineWidth=1.2;
    x.beginPath(); x.arc(Math.cos(a)*r,Math.sin(a)*r,Math.max(2.4,faceR*0.017),0,TAU); x.fill(); x.stroke(); x.restore();
  }
  return c;
}
function build(){
  geometry();
  cvs.width=cvs.height=Math.round(S*dpr);
  rims=[makeRim(0),makeRim(1),makeRim(2)];
  face=makeFace();
}
function fit(){
  const r=area.getBoundingClientRect();
  const ns=Math.floor(Math.max(170, Math.min(r.width, r.height) - 14));
  if(ns!==S || !face){ S=ns; wrap.style.setProperty('--s',S+'px'); build(); }
}
new ResizeObserver(fit).observe(area);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(S) build(); });

/* ===== الصوت ===== */
let ac=null, lastTick=0;
function audio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==='suspended') ac.resume(); return ac; }
function blip(f0,f1,dur,vol,type,when){
  const a=audio(); if(!a||!state.sound) return; const t=a.currentTime+(when||0);
  const o=a.createOscillator(), g=a.createGain(); o.type=type||'triangle';
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.02);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
function tick(){ const n=performance.now(); if(n-lastTick<24) return; lastTick=n; blip(900+Math.random()*90,420,0.045,0.16,'triangle'); }
function fanfare(){ [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>blip(f,f*1.002,0.28,0.18,'triangle',i*0.11)); }

/* ===== الدوران ===== */
let pk=0, lastIdx=-1, glow=0, phase=null, w0=0, thW=0, tgt=null, th0=0, th1=0, t0=0, dur=0, lastLive=0, last=performance.now();
const idxAt = th => { const N=state.items.length, a=(((-th)%TAU)+TAU)%TAU; return Math.min(N-1, Math.floor(a/(TAU/N))); };

function spin(){
  const N=state.items.length;
  if(state.spinning || N<2) return;
  closeDrawer(); audio();
  state.spinning=true; winnerIdx=-1; glow=0;
  document.body.classList.add('is-spinning');
  listEl.readOnly=true; hub.disabled=true; hub.textContent='…';
  fireBeam();
  const seg=TAU/N, pick=Math.floor(Math.random()*N);
  tgt=(pick+0.15+0.7*Math.random())*seg;
  phase='wind'; w0=performance.now(); thW=state.theta;
}
function fireBeam(){
  try{
    const m=$('#mascot').getBoundingClientRect(), w=wrap.getBoundingClientRect();
    const fx=m.left+m.width*0.115, fy=m.top+m.height*0.235, cx=w.left+w.width/2, cy=w.top+w.height/2;
    const dx=fx-cx, dy=fy-cy, d=Math.hypot(dx,dy)||1, ex=cx+dx/d*R*1.0, ey=cy+dy/d*R*1.0;
    const qx=(fx+ex)/2, qy=(fy+ey)/2-d*0.12, dd=`M${fx.toFixed(1)} ${fy.toFixed(1)} Q${qx.toFixed(1)} ${qy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`;
    $('#bp1').setAttribute('d',dd); $('#bp2').setAttribute('d',dd);
    const im=$('#bimp'); im.setAttribute('cx',ex.toFixed(1)); im.setAttribute('cy',ey.toFixed(1));
    const bm=$('#beam'); bm.classList.add('on'); clearTimeout(fireBeam.t); fireBeam.t=setTimeout(()=>bm.classList.remove('on'),1900);
  }catch(e){}
}
function launch(now){
  th0=state.theta;
  const d=((((-tgt)-th0)%TAU)+TAU)%TAU;
  th1=th0+(5+Math.floor(Math.random()*3))*TAU+d;
  dur=5600+Math.random()*1800; t0=now; phase='spin';
}
function finish(){
  phase=null; state.spinning=false;
  state.theta=th1%TAU;
  document.body.classList.remove('is-spinning');
  hub.disabled=false; hub.textContent='أدِر'; listEl.readOnly=false;
  const N=state.items.length; winnerIdx=idxAt(state.theta);
  const name=state.items[winnerIdx], col=colorOf(winnerIdx,N);
  pending=winnerIdx; glow=1;
  live.textContent='وقع الاختيار على: '+name;
  histN++; hist.push({n:histN,name,col}); if(hist.length>30) hist.shift(); renderHist();
  fanfare(); burst();
  const mi=document.querySelector('.mi'); mi.classList.remove('cheer'); void mi.offsetWidth; mi.classList.add('cheer'); setTimeout(()=>mi.classList.remove('cheer'),1600);
  setTimeout(()=>showModal(name,col), 700);
}

/* ===== الرسم ===== */
function draw(now){
  const N=state.items.length;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,S,S);
  if(!rims.length) return;
  ctx.drawImage(rims[Math.floor(now/(state.spinning?90:420))%3],0,0,S,S);
  ctx.save(); ctx.translate(S/2,S/2); ctx.rotate(state.theta);
  ctx.drawImage(face,-faceR,-faceR,faceR*2,faceR*2);
  if(glow && winnerIdx>=0 && N>=2){
    const seg=TAU/N, a0=winnerIdx*seg-Math.PI/2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,faceR,a0,a0+seg); ctx.closePath();
    ctx.fillStyle=`rgba(255,255,255,${0.16+0.14*Math.sin(now/170)})`; ctx.fill();
  }
  ctx.restore();
  if(N>=2){
    ctx.save(); ctx.beginPath(); ctx.arc(S/2,S/2,faceR,0,TAU); ctx.clip();
    const gl=ctx.createRadialGradient(S/2-faceR*.38,S/2-faceR*.55,faceR*.04,S/2-faceR*.38,S/2-faceR*.55,faceR*.95);
    gl.addColorStop(0,'rgba(255,255,255,.2)'); gl.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gl; ctx.fillRect(0,0,S,S); ctx.restore();
  }
  const hr=S*0.125, g=ctx.createRadialGradient(S/2-hr*0.3,S/2-hr*0.3,hr*0.1,S/2,S/2,hr);
  g.addColorStop(0,'#8a5a9c'); g.addColorStop(1,'#3a1d52');
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=12*dpr; ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(S/2,S/2,hr,0,TAU); ctx.fill(); ctx.restore();
  ctx.lineWidth=4; ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.arc(S/2,S/2,hr,0,TAU); ctx.stroke();
  ctx.lineWidth=2; ctx.strokeStyle='#5a3a6e'; ctx.beginPath(); ctx.arc(S/2,S/2,hr+3,0,TAU); ctx.stroke();
}
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(phase==='wind'){
    const p=clamp((now-w0)/380,0,1);
    state.theta=thW-0.26*Math.sin(p*Math.PI/2);
    if(p>=1) launch(now);
  } else if(phase==='spin'){
    const p=clamp((now-t0)/dur,0,1), e=1-Math.pow(1-p,4);
    state.theta=th0+(th1-th0)*e;
    if(p>=1) finish();
  }
  const N=state.items.length;
  if(N>=2){
    const idx=idxAt(state.theta);
    if(idx!==lastIdx){
      lastIdx=idx;
      if(state.spinning){ tick(); pk=-24;
        if(now-lastLive>45){ lastLive=now; live.textContent='المؤشر عند: '+state.items[idx]; } }
    }
  }
  pk*=Math.exp(-dt*12);
  ptr.style.transform=`rotate(${pk.toFixed(2)}deg)`;
  draw(now);
  requestAnimationFrame(frame);
}

/* ===== النافذة ===== */
function showModal(name,col){
  const m=$('#mName'); m.textContent=name;
  modal.style.setProperty('--wc',col); modal.style.setProperty('--wt',textOn(col));
  $('#removeW').style.display = state.auto ? 'none' : '';
  modal.classList.add('show'); $('#again').focus({preventScroll:true});
}
function closeModal(){
  if(!modal.classList.contains('show')) return;
  modal.classList.remove('show');
  if(state.auto && pending!==null && pending<state.items.length){ state.items.splice(pending,1); setItems(state.items); }
  pending=null;
}
$('#closeM').onclick=closeModal;
$('#again').onclick=()=>{ closeModal(); setTimeout(spin,260); };
$('#removeW').onclick=()=>{
  if(pending!==null && pending<state.items.length){ state.items.splice(pending,1); pending=null; setItems(state.items); }
  closeModal();
};
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });

/* ===== القائمة ===== */
const parse = t => t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(s=>s.slice(0,60)).slice(0,100);
function setItems(arr, fromText){
  state.items=arr.slice(0,100); winnerIdx=-1; glow=0; lastIdx=-1;
  if(!fromText) listEl.value=state.items.join('\n');
  $('#cnt').textContent=state.items.length; $('#cnt2').textContent=state.items.length;
  hub.disabled = state.spinning || state.items.length<2;
  live.textContent = state.items.length<2 ? 'أضف خيارين على الأقل لتبدأ' : 'اضغط «أدِر» للبدء';
  save(); if(S) build();
}
let tmr=null;
listEl.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(()=>setItems(parse(listEl.value),true),120); });
const pr=$('#presets');
PRESETS.forEach(([label,arr,main])=>{
  const b=document.createElement('button'); b.className='chip'+(main?' main':''); b.textContent=label;
  b.onclick=()=>{ if(state.spinning) return; setItems(arr.slice()); }; pr.appendChild(b);
});
$('#shuffle').onclick=()=>{ if(state.spinning) return; const a=state.items.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } setItems(a); };
$('#clear').onclick=()=>{ if(state.spinning) return; setItems([]); listEl.focus(); };
$('#auto').checked=state.auto;
$('#auto').onchange=e=>{ state.auto=e.target.checked; save(); };

function renderHist(){
  const h=$('#hist'); h.innerHTML='';
  if(!hist.length){ const d=document.createElement('div'); d.className='empty'; d.textContent='لا توجد نتائج بعد'; h.appendChild(d); return; }
  hist.slice().reverse().forEach(r=>{
    const it=document.createElement('div'); it.className='it';
    const n=document.createElement('span'); n.className='n'; n.textContent=r.n; n.style.background=r.col;
    const t=document.createElement('span'); t.className='t'; t.textContent=r.name;
    it.append(n,t); h.appendChild(it);
  });
}
$('#clearH').onclick=()=>{ hist=[]; histN=0; renderHist(); };

/* ===== الدرج على الجوال ===== */
function openDrawer(){ panel.classList.add('open'); dbg.classList.add('show'); }
function closeDrawer(){ panel.classList.remove('open'); dbg.classList.remove('show'); }
$('#optBtn').onclick=openDrawer; $('#closeD').onclick=closeDrawer; dbg.onclick=closeDrawer;

/* ===== الصوت وملء الشاشة ===== */
function syncSnd(){ $('#sndOn').style.display=state.sound?'':'none'; $('#sndOff').style.display=state.sound?'none':''; }
$('#soundBtn').onclick=()=>{ state.sound=!state.sound; syncSnd(); save(); if(state.sound){ audio(); blip(800,1000,.08,.15); } };
syncSnd();
const fsb=$('#fsBtn');
if(!document.fullscreenEnabled && !document.webkitFullscreenEnabled) fsb.style.display='none';
fsb.onclick=()=>{ try{
  if(document.fullscreenElement||document.webkitFullscreenElement) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else { const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }
}catch(e){} };

hub.onclick=spin;
$('.ringw').addEventListener('click',spin);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeModal(); closeDrawer(); return; }
  if((e.key===' '||e.key==='Enter') && document.activeElement && document.activeElement.tagName!=='TEXTAREA' && document.activeElement.tagName!=='BUTTON'
     && !modal.classList.contains('show')){ e.preventDefault(); spin(); }
});

/* ===== قصاصات الاحتفال ===== */
const cv=$('#confetti'), cx=cv.getContext('2d'); let parts=[], cRun=false;
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeC(){ cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener('resize',sizeC); sizeC();
function burst(){
  const r=wrap.getBoundingClientRect(), ox=r.left+r.width/2, oy=r.top+r.height/2, n=reduce?30:150;
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.5, sp=6+Math.random()*13;
    parts.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:.3,w:6+Math.random()*8,h:4+Math.random()*7,rot:Math.random()*TAU,vr:(Math.random()-.5)*.4,
      c:PALETTE[Math.floor(Math.random()*PALETTE.length)],s:Math.floor(Math.random()*3)});
  }
  if(!reduce) for(let i=0;i<80;i++) parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*300,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.04,
    w:6+Math.random()*7,h:4+Math.random()*6,rot:Math.random()*TAU,vr:(Math.random()-.5)*.3,c:PALETTE[Math.floor(Math.random()*PALETTE.length)],s:Math.floor(Math.random()*3)});
  if(!cRun){ cRun=true; requestAnimationFrame(cLoop); }
}
function cLoop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+40);
  for(const p of parts){
    p.vx*=.992; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.c;
    if(p.s===0) cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    else if(p.s===1){ cx.beginPath(); cx.arc(0,0,p.h/1.6,0,TAU); cx.fill(); }
    else cx.fillRect(-p.w/2,-1.5,p.w*1.4,3);
    cx.restore();
  }
  if(parts.length) requestAnimationFrame(cLoop); else { cRun=false; cx.clearRect(0,0,innerWidth,innerHeight); }
}


/* ===== تشغيل ===== */
renderHist();
setItems(state.items);
fit();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
